# ==========================================
# College Discovery Platform — Configuration
# Supports: Local Dev + Railway Production
# ==========================================

# Server — Railway injects PORT; fallback 8080 locally
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────
# Railway MySQL plugin automatically provides these variables:
#   MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
#
# Also supports DATABASE_URL format (some Railway setups):
#   spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/college_db}
#
# JDBC URL built from individual vars (more reliable on Railway):
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:college_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=3
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:220298158ns#NS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool (HikariCP) ─────────────────────────────────
# Tuned for Railway: allow longer startup time for MySQL to be ready
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

# ── Data Initialization ────────────────────────────────────────
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ── Error Handling ─────────────────────────────────────────────
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ── Actuator (health check endpoint) ──────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Logging ────────────────────────────────────────────────────
logging.level.com.college=INFO
logging.level.org.springframework.web=WARN
logging.level.com.zaxxer.hikari=INFO
